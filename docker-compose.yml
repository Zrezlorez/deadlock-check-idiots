services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dick-game-bot
    restart: unless-stopped
    init: true
    environment:
      TZ: Europe/Moscow
    volumes:
      - ./application.properties:/app/config/application.properties:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
